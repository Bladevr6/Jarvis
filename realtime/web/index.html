<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<title>Jarvis</title>
</head>
<body data-state="idle">
  <header>
    <h1>JARVIS</h1>
    <p id="status" role="status" aria-live="polite">Appuyez pour parler</p>
  </header>

  <main>
    <button id="orb" class="orb" type="button" aria-label="Parler à Jarvis">
      <svg class="mic" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/>
      </svg>
    </button>
  </main>

  <div id="banner" class="banner" role="alert" hidden></div>
  <section id="log" class="log" aria-live="polite"></section>

  <audio id="remote" autoplay playsinline></audio>
  <script src="/app.js"></script>
</body>
</html>
